[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shader-playground-live"
version = "0.4.2"
description = "Live GLSL/HLSL shader playground for Windows — hot reload, uniform inspector, SPIR-V export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shader-playground-live contributors" }]
keywords = ["glsl", "hlsl", "shader", "opengl", "vulkan", "live-reload", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "PySide6>=6.7,<6.9",
    "moderngl>=5.10",
    "moderngl-window>=2.4",
    "numpy>=1.26",
    "pyglm>=2.7",
    "watchdog>=4.0",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-watchdog",
]
native = [
    # Marker only — the native bridge is built with CMake, not pip.
]

[project.scripts]
shader-playground = "shader_playground.bootstrap.entrypoint:main"
sp-live = "shader_playground.bootstrap.entrypoint:main"

[project.urls]
Homepage = "https://github.com/yourname/shader-playground-live"
Issues = "https://github.com/yourname/shader-playground-live/issues"
Changelog = "https://github.com/yourname/shader-playground-live/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["shader_playground*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["shader_playground", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a live OpenGL 4.3 context",
    "slow: takes more than 2 seconds",
]